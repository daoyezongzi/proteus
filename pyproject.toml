[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "proteus-opportunity-finder"
version = "0.2.5"
description = "Evidence-first automotive parts opportunity finder"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.20,<5",
  "keyring>=25,<26",
  "playwright>=1.45,<2",
]

[project.optional-dependencies]
dev = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pytest>=8,<10",
]
amazon = [
  "python-amazon-sp-api>=2.1,<3",
]
api = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
proteus = "proteus.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/proteus/contracts" = [
  "contracts/v0_1_acquisition.schema.json",
  "contracts/v0_1_opportunity_report.schema.json",
  "contracts/v0_2_acquisition.schema.json",
  "contracts/v0_2_candidate_discovery.schema.json",
  "contracts/v0_2_opportunity_report.schema.json",
  "contracts/v0_2_4_product_family_resolution.schema.json",
  "contracts/v0_2_4_northway_mvp_result.schema.json",
  "contracts/v0_2_5_category_definition.schema.json",
  "contracts/v0_2_5_northway_mvp_result.schema.json",
]

[tool.setuptools.package-data]
proteus = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"
